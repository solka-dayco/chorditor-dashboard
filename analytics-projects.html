<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chorditor Projects</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* ══════════════════════════════════════════════
     토큰 — dashboard.html이랑 동일(docs/style-guide.md §1·§5 기준).
     데스크탑(1600px~)/모바일(360~480px) 2단계만 대응.
     ══════════════════════════════════════════════ */
  :root {
    --bg: #FAFAF9;
    --surface: #ffffff;
    --border: #d9d4cc;
    --gray-light: #ECECEA;
    --text-primary: #242729;
    --text-secondary: #6b6560;
    --text-muted: #a09b95;
    --accent: #e03c31;
    --blue: #4f7cff;
    --brand: #1a1a1a;

    --grid-margin: 20px;
    --grid-gutter: 16px;
    --grid-cols: 6;
    --grid-container-max: 100%;

    --db-card-shadow: 0 2px 16px rgba(0, 0, 0, 0.2);
  }
  @media (min-width: 1600px) {
    :root {
      --grid-margin: 32px;
      --grid-gutter: 24px;
      --grid-cols: 12;
      --grid-container-max: min(100%, 1264px);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .db-wrap {
    max-width: var(--grid-container-max);
    margin-inline: auto;
    padding: var(--grid-margin);
  }

  .db-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .db-title { font-size: 20px; font-weight: 700; margin: 0; }
  .db-updated { font-size: 13px; color: var(--text-muted); }

  .db-tabs { display: flex; gap: 16px; margin-bottom: 24px; }
  .db-tabs a {
    font-size: 14px;
    color: var(--text-secondary);
    text-decoration: none;
    padding-bottom: 6px;
    border-bottom: 2px solid transparent;
  }
  .db-tabs a.active { color: var(--text-primary); font-weight: 700; border-bottom-color: var(--text-primary); }

  .db-grid {
    display: grid;
    grid-template-columns: repeat(var(--grid-cols), 1fr);
    gap: var(--grid-gutter);
  }

  /* 섹션은 코드(FN_SECTIONS)에서 정의 — 사용자가 타이틀 입력해 만들던 방식 폐기 */
  .fn-section-list {
    grid-column: span var(--grid-cols);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .fn-section-chip {
    display: flex;
    align-items: center;
    background: var(--surface);
    box-shadow: var(--db-card-shadow);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .fn-section-chip.active { background: var(--text-primary); color: var(--bg); }

  .fn-content {
    grid-column: span var(--grid-cols);
    background: var(--surface);
    box-shadow: var(--db-card-shadow);
    border-radius: 16px;
    padding: 20px;
    display: none;
  }
  .fn-content.active { display: block; }
  .fn-content-title { font-size: 16px; font-weight: 700; margin: 0 0 16px; }
  .fn-content-body {
    aspect-ratio: 1.618 / 1; /* 골든비율 — 차트 영역 자체에만 적용 */
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── 데일리미션 분석 프로젝트: KPI 타일 (1차 디자인, 값은 정적 — 9/8 실측치) ──
     fn-content-body를 그대로 재사용 — 골든비율/flex-center는 KPI 모드에서 해제 */
  .fn-content-body.fn-kpi-mode {
    aspect-ratio: auto;
    display: block;
    max-width: 600px;
    color: var(--text-primary);
  }
  /* 모바일 기본: KPI 위 / 시계열 아래 세로 스택 */
  .fn-kpi-layout { display: flex; flex-direction: column; gap: 20px; }
  /* 데스크탑: KPI 좌측 / 시계열 우측 2단 배치라 600px 캡 해제 */
  @media (min-width: 1600px) {
    .fn-content-body.fn-kpi-mode { max-width: none; }
    .fn-kpi-layout { flex-direction: row; align-items: flex-start; gap: 24px; }
    .fn-kpi-left { flex: 1; min-width: 0; }
    .fn-kpi-right { flex: 1; min-width: 0; }
  }
  .fn-kpi-hero {
    background: var(--text-primary);
    color: var(--bg);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .fn-kpi-hero-label { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 8px; }
  .fn-kpi-hero-value { font-size: 40px; font-weight: 700; line-height: 1; }
  .fn-kpi-hero-value span { font-size: 18px; font-weight: 600; margin-left: 4px; color: rgba(255,255,255,0.8); }
  .fn-kpi-hero-sub { font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 10px; }

  .fn-kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .fn-kpi-tile {
    background: var(--gray-light);
    border-radius: 12px;
    padding: 16px;
  }
  .fn-kpi-tile-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.3; }
  .fn-kpi-tile-value { font-size: 26px; font-weight: 700; white-space: nowrap; }
  .fn-kpi-tile-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  /* 모바일도 2x2 유지 — 폭이 좁아지는 만큼 패딩/폰트만 축소 */
  @media (max-width: 480px) {
    .fn-kpi-hero { padding: 16px; }
    .fn-kpi-hero-value { font-size: 32px; }
    .fn-kpi-grid { gap: 8px; }
    .fn-kpi-tile { padding: 10px; border-radius: 10px; }
    .fn-kpi-tile-label { font-size: 11px; margin-bottom: 4px; }
    .fn-kpi-tile-value { font-size: 19px; }
    .fn-kpi-tile-sub { font-size: 10px; margin-top: 4px; }
  }

  .db-card {
    background: var(--surface);
    box-shadow: var(--db-card-shadow);
    border-radius: 16px;
    padding: 20px;
    grid-column: span var(--grid-cols);
    min-height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* 그리드 오버레이 — G키로 토글, 컬럼 정렬 디버그용 */
  .grid-overlay {
    display: none;
    position: fixed;
    inset: 0;
    max-width: var(--grid-container-max);
    margin-inline: auto;
    padding-inline: var(--grid-margin);
    grid-template-columns: repeat(var(--grid-cols), 1fr);
    gap: var(--grid-gutter);
    z-index: 9999;
    pointer-events: none;
  }
  .grid-overlay.active { display: grid; }
  .grid-overlay > div {
    height: 100%;
    background: rgba(79, 124, 255, 0.12);
    outline: 1px solid rgba(79, 124, 255, 0.4);
  }

  /* ── 관리자 로그인 게이트 (dashboard.html과 동일) ── */
  #db-gate {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #db-gate[hidden] { display: none !important; }
  .db-gate-card {
    width: 100%; max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .db-gate-title { font-size: 20px; font-weight: 600; color: var(--text-primary); margin: 0; }
  .db-gate-card button {
    font-family: inherit; font-size: 16px; font-weight: 600;
    padding: 12px; border: 0; border-radius: 8px;
    background: var(--text-primary); color: var(--bg); cursor: pointer;
  }
  .db-gate-card button:disabled { opacity: .5; cursor: default; }
  .db-gate-err { font-size: 13px; color: #e03c31; min-height: 18px; margin: 0; }
  #db-signout {
    font-family: inherit; font-size: 13px; color: var(--text-secondary);
    background: none; border: 0; cursor: pointer; text-decoration: underline;
  }

  /* ── 시계열 차트 — dashboard.html db-chart-* 패턴 그대로 재사용 ──
     상단 여백은 fn-kpi-layout의 gap이 담당(좌우 배치 fn-kpi-right 안에 단독으로 들어가므로) */
  .fn-chart-wrap { margin-top: 0; }
  .db-chart-header { display: flex; align-items: center; justify-content: space-between; }
  .db-chart-title { font-size: 16px; font-weight: 700; margin: 0; }
  .db-chart-select {
    font-family: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--gray-light); border: none; border-radius: 8px; padding: 6px 10px;
  }
  .db-chart-body {
    aspect-ratio: 1.618 / 1;
    position: relative;
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .db-chart-body canvas { width: 100% !important; height: 100% !important; }
  .db-chart-legend-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; row-gap: 8px; flex-shrink: 0;
    padding-top: 12px; position: relative;
  }
  .db-chart-legend {
    display: flex; flex-wrap: wrap; row-gap: 6px; gap: 16px;
    font-size: 12px; color: var(--text-secondary);
  }
  .db-legend-item { display: flex; align-items: center; gap: 6px; }
  .db-legend-item--off { color: var(--text-muted); }
  .db-legend-dot { width: 8px; height: 8px; flex-shrink: 0; }
  .db-legend-toggle-btn {
    font-family: inherit; font-size: 12px; color: var(--text-secondary);
    background: var(--gray-light); border: none; border-radius: 8px;
    padding: 5px 10px; cursor: pointer;
  }
  .db-legend-menu {
    display: none; position: absolute; right: 0; bottom: calc(100% + 8px);
    background: var(--surface); box-shadow: var(--db-card-shadow);
    border-radius: 12px; padding: 10px; z-index: 10; min-width: 160px;
  }
  .db-legend-menu.open { display: block; }
  .db-legend-menu label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 6px 4px; cursor: pointer;
  }
  .fn-chart-note { font-size: 12px; color: var(--text-muted); margin: 8px 0 0; }

  /* ── 7일 체험 실험 프로젝트: 목업(trial-experiment-mockup.html)에서 이식 ──
     nested box-shadow 대신 기존 fn-kpi-tile 패턴처럼 플랫 패널(테두리)로 통일 */
  .fn-trial-grid { display: grid; grid-template-columns: repeat(var(--grid-cols), 1fr); gap: var(--grid-gutter); }
  .fn-trial-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    grid-column: span var(--grid-cols);
  }
  @media (min-width: 1600px) {
    .fn-trial-panel--half { grid-column: span 6; }
  }
  .fn-trial-panel-title { font-size: 14px; font-weight: 700; margin: 0; }
  .fn-trial-panel-sub { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }

  .fn-trial-progress-row { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 8px; }
  .fn-trial-progress-num { font-size: 34px; font-weight: 700; }
  .fn-trial-progress-goal { font-size: 16px; color: var(--text-muted); }
  .fn-trial-progress-track { width: 100%; height: 12px; background: var(--gray-light); border-radius: 999px; overflow: hidden; }
  .fn-trial-progress-fill { height: 100%; background: var(--brand); border-radius: 999px; transition: width 0.6s ease; }
  .fn-trial-progress-note { font-size: 11px; color: var(--text-muted); margin: 8px 0 0; }

  #fn-trial-progress-trend-wrap { flex: 1; min-height: 140px; margin-top: 12px; }
  #fn-trial-funnel-wrap { flex: 1; min-height: 200px; margin-top: 12px; }

  .fn-trial-cohort-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 12px; }
  @media (max-width: 1199px) { .fn-trial-cohort-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 599px) { .fn-trial-cohort-grid { grid-template-columns: 1fr; } }
  .fn-trial-cohort-sub { display: flex; flex-direction: column; }
  .fn-trial-cohort-sub-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 0 0 6px; }
  .fn-trial-cohort-sub .fn-trial-chart-body { aspect-ratio: 1.9 / 1; }
  .fn-trial-chart-body { position: relative; }
  .fn-trial-chart-body canvas { width: 100% !important; height: 100% !important; }
</style>
</head>
<body>

<div id="db-gate">
  <div class="db-gate-card">
    <h1 class="db-gate-title">관리자 로그인</h1>
    <button type="button" id="db-login-btn">Google로 로그인</button>
    <p class="db-gate-err" id="db-gate-err"></p>
  </div>
</div>

<div class="db-wrap">
  <div class="db-header">
    <h1 class="db-title">분석 프로젝트</h1>
    <span class="db-updated" id="db-updated">마지막 갱신: --</span>
    <button type="button" id="db-signout">로그아웃</button>
  </div>

  <nav class="db-tabs">
    <a href="dashboard.html">대시보드</a>
    <a href="analytics-projects.html" class="active">분석 프로젝트</a>
  </nav>

  <div class="db-grid">
    <div class="fn-section-list" id="fn-section-list"></div>
    <div class="fn-content" id="fn-content">
      <h2 class="fn-content-title" id="fn-content-title"></h2>
      <div class="fn-content-body" id="fn-content-body"></div>
    </div>
  </div>
</div>

<script>
  // ── Supabase 인증 (dashboard.html과 동일 — supabase-js는 인증 전용, 조회는 raw fetch) ──
  const SUPABASE_URL = 'https://jbvkygeksohlysyvaoab.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impidmt5Z2Vrc29obHlzeXZhb2FiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzOTk5NjgsImV4cCI6MjA5MTk3NTk2OH0.6RSgChy0Yq0H2TJpZPSoMKQ2V-OYfR0XzE1aJBBZkXI';
  const sbAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── 데일리미션 KPI: 오늘=실시간 RPC, 과거=mission_funnel_history 테이블 ──
  let fnFunnelChart = null;

  function fnPct(num, den) {
    return den > 0 ? Math.round((num / den) * 1000) / 10 : null;
  }

  async function fnFetchAuthedJson(url, session, opts) {
    const resp = await fetch(url, {
      ...opts,
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${session.access_token}`,
        ...(opts && opts.headers),
      },
    });
    if (!resp.ok) {
      const err = new Error(`${url} → ${resp.status}`);
      err.status = resp.status;
      throw err;
    }
    return resp.json();
  }

  async function fnRenderMissionFunnelKPI(bodyEl) {
    bodyEl.innerHTML = `<div class="fn-kpi-hero"><div class="fn-kpi-hero-label">불러오는 중…</div></div>`;

    let live, history;
    const { data: { session } } = await sbAuth.auth.getSession();
    if (!session) { bodyEl.textContent = '로그인이 필요합니다.'; return; }

    try {
      [live, history] = await Promise.all([
        fnFetchAuthedJson(`${SUPABASE_URL}/rest/v1/rpc/mission_funnel_today`, session, {
          method: 'POST', body: '{}', headers: { 'Content-Type': 'application/json' },
        }).then((rows) => rows[0]),
        fnFetchAuthedJson(`${SUPABASE_URL}/rest/v1/mission_funnel_history?select=*&order=day.asc`, session),
      ]);
    } catch (e) {
      // 관리자 uid가 아니면 mission_funnel_today()가 예외를 던지고(RPC라 400/403대)
      // mission_funnel_history 조회도 RLS에 막혀 같은 부류의 응답이 옴 — 세션을 끊어야
      // 다른 계정으로 재시도 가능(dashboard.html과 동일 정책).
      if ([400, 401, 403].includes(e.status)) {
        await sbAuth.auth.signOut();
        showGate('이 계정에는 조회 권한이 없습니다.');
        return;
      }
      bodyEl.textContent = '데이터를 불러오지 못했습니다: ' + e.message;
      return;
    }

    const adPct = fnPct(live.ad_watched, live.ad_eligible);
    const tiles = [
      { label: '미션 완료율 (완주/대상유저)', pct: fnPct(live.completed, live.dau_135), num: live.completed, den: live.dau_135 },
      { label: '관문 노출률 (노출/대상유저)', pct: fnPct(live.gate_viewed, live.dau_135), num: live.gate_viewed, den: live.dau_135 },
      { label: '관문 통과율 (시작/노출)', pct: fnPct(live.gate_start, live.gate_viewed), num: live.gate_start, den: live.gate_viewed },
      { label: '세션 완주율 (완주/시작)', pct: fnPct(live.completed, live.gate_start), num: live.completed, den: live.gate_start },
    ];

    bodyEl.innerHTML = `
      <div class="fn-kpi-layout">
        <div class="fn-kpi-left">
          <div class="fn-kpi-hero">
            <div class="fn-kpi-hero-label">오늘 광고 시청 (2배 보상, clear+review 합산)</div>
            <div class="fn-kpi-hero-value">${live.ad_watched}<span>건</span></div>
            <div class="fn-kpi-hero-sub">완주 ${live.ad_eligible}명 중 ${adPct ?? '-'}% 시청 완료 · 실시간</div>
          </div>
          <div class="fn-kpi-grid">
            ${tiles.map((t) => `
              <div class="fn-kpi-tile">
                <div class="fn-kpi-tile-label">${t.label}</div>
                <div class="fn-kpi-tile-value">${t.pct ?? '-'}%</div>
                <div class="fn-kpi-tile-sub">${t.num} / ${t.den}명</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="fn-kpi-right">
          <div class="fn-chart-wrap">
            <div class="db-chart-header">
              <h3 class="db-chart-title">일별 추세</h3>
              <select class="db-chart-select" id="fn-chart-range">
                <option value="all">전체</option>
                <option value="7">7일</option>
                <option value="30">30일</option>
                <option value="180">6개월</option>
              </select>
            </div>
            <div class="db-chart-body"><canvas id="fn-funnel-chart"></canvas></div>
            <div class="db-chart-legend-row">
              <div class="db-chart-legend" id="fn-chart-legend"></div>
              <button class="db-legend-toggle-btn" id="fn-chart-menu-btn">지표 선택</button>
              <div class="db-legend-menu" id="fn-chart-menu">
                ${Object.entries(FN_SERIES_META).map(([key, m]) => `
                  <label><input type="checkbox" value="${key}" checked> ${m.label}</label>
                `).join('')}
              </div>
            </div>
            <p class="fn-chart-note">점선 구간 = 오늘(진행중, 미확정)</p>
          </div>
        </div>
      </div>
    `;

    document.getElementById('fn-chart-menu-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('fn-chart-menu').classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (e.target.closest('#fn-chart-menu')) return; // 메뉴 내부(체크박스 등) 클릭은 안 닫음
      document.getElementById('fn-chart-menu')?.classList.remove('open');
    });
    document.querySelectorAll('#fn-chart-menu input').forEach((cb) => {
      cb.addEventListener('change', () => fnRenderFunnelChart(history));
    });
    document.getElementById('fn-chart-range').addEventListener('change', () => fnRenderFunnelChart(history));

    fnRenderFunnelChart(history);
  }

  // dashboard.html rowsInRange()와 동일 — 'all'이면 전체, 아니면 최근 N일
  function fnRowsInRange(rangeVal, rows) {
    if (rangeVal === 'all') return rows;
    const n = parseInt(rangeVal, 10);
    return rows.slice(-n);
  }

  // dashboard.html SERIES_META와 동일한 형태 — 색상은 style-guide.md §1 아이콘 컬러 재사용
  const FN_SERIES_META = {
    completion:       { label: '완료율',     color: '#e03c31', val: (r) => fnPct(r.completed, r.dau_135) },
    gate_view:        { label: '관문노출률',  color: '#4f7cff', val: (r) => fnPct(r.gate_viewed, r.dau_135) },
    gate_pass:        { label: '관문통과율',  color: '#2E9E72', val: (r) => fnPct(r.gate_start, r.gate_viewed) },
    session_complete: { label: '세션완주율',  color: '#E8C000', val: (r) => fnPct(r.completed, r.gate_start) },
  };

  function fnRenderChartLegend() {
    const checked = new Set(Array.from(document.querySelectorAll('#fn-chart-menu input:checked')).map((el) => el.value));
    const legend = document.getElementById('fn-chart-legend');
    legend.innerHTML = Object.entries(FN_SERIES_META).map(([key, m]) => {
      const on = checked.has(key);
      const dotColor = on ? m.color : 'var(--border)';
      return `<span class="db-legend-item${on ? '' : ' db-legend-item--off'}">` +
        `<span class="db-legend-dot" style="background:${dotColor};"></span>${m.label}</span>`;
    }).join('');
  }

  function fnRenderFunnelChart(allRows) {
    fnRenderChartLegend();
    const rangeVal = document.getElementById('fn-chart-range').value;
    const rows = fnRowsInRange(rangeVal, allRows);
    const todayStr = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); // KST 캘린더데이
    const checked = Array.from(document.querySelectorAll('#fn-chart-menu input:checked')).map((el) => el.value);

    const datasets = checked.map((key) => {
      const m = FN_SERIES_META[key];
      return {
        label: m.label,
        data: rows.map((r) => m.val(r)),
        borderColor: m.color,
        backgroundColor: m.color,
        tension: 0,
        pointRadius: 0,
        borderWidth: 2,
        segment: {
          // 오늘로 이어지는 마지막 구간만 점선 — 미완성 데이터임을 표시
          borderDash: (ctx) => (rows[ctx.p1DataIndex]?.day === todayStr ? [5, 4] : undefined),
        },
      };
    });

    if (fnFunnelChart) fnFunnelChart.destroy();
    fnFunnelChart = new Chart(document.getElementById('fn-funnel-chart'), {
      type: 'line',
      data: { labels: rows.map((r) => r.day), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (item) => `${item.dataset.label}: ${item.parsed.y.toFixed(1)}%` } },
        },
        scales: {
          x: { ticks: { maxTicksLimit: 8 } },
          y: { min: 0, ticks: { callback: (v) => v + '%' } },
        },
      },
    });
  }

  // ── 7일 체험 만료 후 전환율 실험 (docs/trial-experiment-dashboard-plan.md 기반, 목업 포팅)
  // ⚠️ 전부 하드코딩된 목업 데이터 — 실제 쿼리/DB 연결 전까지는 이 값 그대로 표시됨.
  function fnRenderTrialExperiment(bodyEl) {
    const FUNNEL_LABELS = ['지급', '재접속', '알림노출', '결제(알림경유)'];
    const FUNNEL_VALUES = [7000, 5320, 3980, 62];
    const FUNNEL_PCTS = FUNNEL_VALUES.map((v) => +(v / FUNNEL_VALUES[0] * 100).toFixed(1));
    const FUNNEL_COLORS = ['rgba(26,26,26,0.25)', 'rgba(26,26,26,0.5)', 'rgba(26,26,26,0.75)', '#1a1a1a'];

    const PROGRESS_CURRENT = 118;
    const PROGRESS_GOAL = 300;

    bodyEl.innerHTML = `
      <div class="fn-trial-grid">
        <div class="fn-trial-panel fn-trial-panel--half">
          <h3 class="fn-trial-panel-title">실험 진행률</h3>
          <p class="fn-trial-panel-sub">만료자 수 / ${PROGRESS_GOAL} (정지조건)</p>
          <div class="fn-trial-progress-row">
            <span class="fn-trial-progress-num">${PROGRESS_CURRENT}</span>
            <span class="fn-trial-progress-goal">/ ${PROGRESS_GOAL}</span>
          </div>
          <div class="fn-trial-progress-track"><div class="fn-trial-progress-fill" id="fn-trial-progress-fill" style="width:0%"></div></div>
          <p class="fn-trial-progress-note">8일차부터 만료자 발생 시작</p>
          <div class="fn-trial-chart-body" id="fn-trial-progress-trend-wrap"><canvas id="fn-trial-progress-trend"></canvas></div>
        </div>

        <div class="fn-trial-panel fn-trial-panel--half">
          <h3 class="fn-trial-panel-title">체험판 전환 퍼널</h3>
          <p class="fn-trial-panel-sub">지급 → 재접속 → 알림노출 → 결제(알림경유)</p>
          <div class="fn-trial-chart-body" id="fn-trial-funnel-wrap"></div>
        </div>

        <div class="fn-trial-panel">
          <h3 class="fn-trial-panel-title">코호트별 전환율 비교</h3>
          <p class="fn-trial-panel-sub">그룹별 알림경유 결제 전환율(%) — 분모=그룹 내 지급인원, 분자=그룹 내 결제인원</p>
          <div class="fn-trial-cohort-grid">
            <div class="fn-trial-cohort-sub">
              <p class="fn-trial-cohort-sub-title">성별 × 나이대</p>
              <div class="fn-trial-chart-body"><canvas id="fn-trial-cohort-demo"></canvas></div>
            </div>
            <div class="fn-trial-cohort-sub">
              <p class="fn-trial-cohort-sub-title">페르소나</p>
              <div class="fn-trial-chart-body"><canvas id="fn-trial-cohort-persona"></canvas></div>
            </div>
            <div class="fn-trial-cohort-sub">
              <p class="fn-trial-cohort-sub-title">피크소진 횟수구간</p>
              <div class="fn-trial-chart-body"><canvas id="fn-trial-cohort-peak"></canvas></div>
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('fn-trial-progress-fill').style.width = (PROGRESS_CURRENT / PROGRESS_GOAL * 100) + '%';

    // ── 퍼널: SVG 사다리꼴(직사각형, 로그스케일 너비) — 라벨은 왼쪽 고정, 막대는 오른쪽 레인 중앙정렬
    function buildFunnelSVG() {
      const wrap = document.getElementById('fn-trial-funnel-wrap');
      const n = FUNNEL_VALUES.length;
      const rect = wrap.getBoundingClientRect();
      const W = rect.width, bandH = rect.height / n, H = rect.height;
      const textX = 0;
      const barLaneStart = W * 0.46;
      const barLaneW = W - barLaneStart;

      const logs = FUNNEL_VALUES.map((v) => Math.log10(v));
      const maxLog = Math.max(...logs), minLog = Math.min(...logs);
      const minW = barLaneW * 0.18, maxW = barLaneW * 0.96;
      const widthFor = (v) => {
        if (maxLog === minLog) return maxW;
        const t = (Math.log10(v) - minLog) / (maxLog - minLog);
        return minW + t * (maxW - minW);
      };
      const widths = FUNNEL_VALUES.map(widthFor);

      let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif">`;
      FUNNEL_LABELS.forEach((label, i) => {
        const barW = widths[i];
        const barX = barLaneStart + (barLaneW - barW) / 2;
        const y0 = i * bandH;
        const y1 = y0 + bandH;
        const points = `${barX},${y0} ${barX + barW},${y0} ${barX + barW},${y1} ${barX},${y1}`;
        const midY = y0 + bandH / 2;
        svg += `<polygon points="${points}" fill="${FUNNEL_COLORS[i]}" />`;
        svg += `<text x="${textX}" y="${midY - 4}" text-anchor="start" font-size="12" font-weight="600" fill="var(--text-secondary)">${label}</text>`;
        svg += `<text x="${textX}" y="${midY + 18}" text-anchor="start" font-size="20" font-weight="300" fill="var(--text-primary)">${FUNNEL_VALUES[i].toLocaleString()}<tspan font-size="11" font-weight="400" dx="4" fill="var(--text-secondary)">${FUNNEL_PCTS[i]}%</tspan></text>`;
      });
      svg += '</svg>';
      wrap.innerHTML = svg;
    }
    buildFunnelSVG();
    window.addEventListener('resize', buildFunnelSVG);

    // ── 진행률 시계열: 지연출발 곡선 + D+8 만료시작 점선
    const trendDays = Array.from({ length: 30 }, (_, i) => `D+${i + 1}`);
    const trendValues = trendDays.map((_, i) => {
      const day = i + 1;
      if (day < 8) return 0;
      return Math.round(PROGRESS_CURRENT * Math.min(1, (day - 7) / 23) ** 1.3);
    });
    new Chart(document.getElementById('fn-trial-progress-trend'), {
      type: 'line',
      data: {
        labels: trendDays,
        datasets: [{
          data: trendValues,
          borderColor: '#1a1a1a',
          backgroundColor: 'rgba(26,26,26,0.06)',
          fill: true,
          tension: 0.3,
          pointRadius: 0,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { maxTicksLimit: 6 } },
          y: { grid: { color: '#ECECEA' } },
        },
      },
      plugins: [{
        id: 'startLine',
        afterDraw(chart) {
          const idx = trendDays.indexOf('D+8');
          if (idx < 0) return;
          const { ctx, chartArea, scales } = chart;
          const x = scales.x.getPixelForValue(idx);
          ctx.save();
          ctx.strokeStyle = '#e03c31';
          ctx.setLineDash([4, 3]);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(x, chartArea.top);
          ctx.lineTo(x, chartArea.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        },
      }],
    });

    // ── 코호트 비교 (목업 수치)
    function cohortBarChart(canvasId, labels, values, counts, colors) {
      new Chart(document.getElementById(canvasId), {
        type: 'bar',
        data: { labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 0, barPercentage: 0.6 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (ctx) => `${ctx.raw}% (${counts[ctx.dataIndex]}명)` } },
          },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { color: '#ECECEA' }, ticks: { callback: (v) => v + '%' } },
          },
        },
      });
    }

    const AGE_LABELS = ['10대', '20대', '30대', '40대', '50대', '60대+'];
    const DEMO_FEMALE_PCT = [0.9, 2.6, 2.2, 1.7, 2.1, 1.5];
    const DEMO_FEMALE_CNT = [2, 29, 20, 11, 9, 3];
    const DEMO_MALE_PCT = [0.7, 2.2, 1.8, 1.3, 1.7, 1.1];
    const DEMO_MALE_CNT = [1, 24, 16, 8, 8, 2];
    new Chart(document.getElementById('fn-trial-cohort-demo'), {
      type: 'bar',
      data: {
        labels: AGE_LABELS,
        datasets: [
          { label: '여성', data: DEMO_FEMALE_PCT, backgroundColor: '#C94B7A', borderRadius: 0, barPercentage: 0.7 },
          { label: '남성', data: DEMO_MALE_PCT, backgroundColor: '#4f7cff', borderRadius: 0, barPercentage: 0.7 },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10 } },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const cnt = ctx.datasetIndex === 0 ? DEMO_FEMALE_CNT[ctx.dataIndex] : DEMO_MALE_CNT[ctx.dataIndex];
                return `${ctx.dataset.label} ${ctx.raw}% (${cnt}명)`;
              },
            },
          },
        },
        scales: {
          x: { grid: { display: false } },
          y: { grid: { color: '#ECECEA' }, ticks: { callback: (v) => v + '%' } },
        },
      },
    });

    cohortBarChart('fn-trial-cohort-persona', ['언박싱', '굳은살', '악보의존', '방구석', '기타마스터'], [0.5, 1.2, 2.6, 1.8, 3.4], [11, 22, 36, 16, 24], '#4f7cff');
    cohortBarChart('fn-trial-cohort-peak', ['1회', '2~4회', '5~9회', '10회+'], [0.6, 1.4, 2.9, 4.7], [5, 34, 32, 19], '#E8C000');
  }

  // ── 섹션 정의 — 여기 배열에 항목을 추가/삭제하는 게 곧 "프로젝트 추가/삭제".
  // render가 없으면 자리표시 문구만 보여준다(신규 섹션 초안용).
  const FN_SECTIONS = [
    { id: 'mission-funnel', title: '데일리미션 분석', kpiMode: true, render: fnRenderMissionFunnelKPI },
    { id: 'trial-experiment', title: '7일 체험 만료 후 전환율 실험', kpiMode: true, render: fnRenderTrialExperiment },
  ];

  let fnActiveId = FN_SECTIONS[0]?.id ?? null;

  function fnRenderSections() {
    const listEl = document.getElementById('fn-section-list');
    const contentEl = document.getElementById('fn-content');
    const bodyEl = document.getElementById('fn-content-body');

    listEl.innerHTML = FN_SECTIONS.map((s) => `
      <span class="fn-section-chip${s.id === fnActiveId ? ' active' : ''}" data-id="${s.id}">${s.title}</span>
    `).join('');

    const active = FN_SECTIONS.find((s) => s.id === fnActiveId);
    contentEl.classList.toggle('active', !!active);
    if (!active) return;

    document.getElementById('fn-content-title').textContent = active.title;
    bodyEl.classList.toggle('fn-kpi-mode', !!active.kpiMode);
    if (active.render) {
      active.render(bodyEl);
    } else {
      bodyEl.textContent = '차트/테이블 자리 (자리만 잡음)';
    }
  }

  document.getElementById('fn-section-list').addEventListener('click', (e) => {
    const chip = e.target.closest('.fn-section-chip');
    if (chip) {
      fnActiveId = chip.dataset.id;
      fnRenderSections();
    }
  });

  // ── 로그인 게이트 (dashboard.html과 동일 패턴) ──
  const gateEl = document.getElementById('db-gate');
  const gateErr = document.getElementById('db-gate-err');
  const loginBtn = document.getElementById('db-login-btn');

  function showGate(msg) {
    gateEl.hidden = false;
    loginBtn.disabled = false;
    gateErr.textContent = msg || '';
  }

  async function startProjectsPage() {
    gateEl.hidden = true;
    // 로그인 실패(RLS 차단) 여부는 데이터 항목을 열 때 fnFetchAuthedJson이 던지는 에러로 확인됨.
    fnRenderSections();
  }

  loginBtn.addEventListener('click', async () => {
    gateErr.textContent = '';
    loginBtn.disabled = true;
    const { error } = await sbAuth.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname },
    });
    if (error) {
      loginBtn.disabled = false;
      gateErr.textContent = '로그인 실패: ' + error.message;
    }
  });

  document.getElementById('db-signout').addEventListener('click', async () => {
    await sbAuth.auth.signOut();
    showGate();
  });

  sbAuth.auth.getSession().then(({ data: { session } }) => {
    if (session) startProjectsPage(); else showGate();
  });
</script>

<div class="grid-overlay" id="grid-overlay"></div>

<script>
  // G키로 그리드 오버레이 토글 — --grid-cols 값 읽어서 그만큼 컬럼 div 생성
  const overlay = document.getElementById('grid-overlay');

  function rebuildOverlay() {
    const cols = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-cols'), 10) || 6;
    overlay.innerHTML = '';
    for (let i = 0; i < cols; i++) {
      overlay.appendChild(document.createElement('div'));
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'g' && e.key !== 'G') return;
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    rebuildOverlay();
    overlay.classList.toggle('active');
  });

  window.addEventListener('resize', () => {
    if (overlay.classList.contains('active')) rebuildOverlay();
  });
</script>

</body>
