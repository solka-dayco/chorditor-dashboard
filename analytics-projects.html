<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chorditor Projects</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* ══════════════════════════════════════════════
     토큰 — dashboard.html이랑 동일(docs/style-guide.md §1·§5 기준).
     데스크탑(1600px~)/모바일(360~480px) 2단계만 대응.
     ══════════════════════════════════════════════ */
  :root {
    --bg: #FAFAF9;
    --surface: #ffffff;
    --border: #d9d4cc;
    --gray-light: #ECECEA;
    --text-primary: #242729;
    --text-secondary: #6b6560;
    --text-muted: #a09b95;
    --accent: #e03c31;
    --blue: #4f7cff;
    --brand: #1a1a1a;

    --grid-margin: 20px;
    --grid-gutter: 16px;
    --grid-cols: 6;
    --grid-container-max: 100%;

    --db-card-shadow: 0 2px 16px rgba(0, 0, 0, 0.2);

    /* Chart.js에 JS로 넘겨줄 값들 — CSS 쪽에서 다크모드 분기하면 JS는 getComputedStyle로만 읽음 */
    --chart-grid: #ECECEA;
    --funnel-1: rgba(26, 26, 26, 0.25);
    --funnel-2: rgba(26, 26, 26, 0.5);
    --funnel-3: rgba(26, 26, 26, 0.75);
    --funnel-4: #1a1a1a;
  }
  @media (min-width: 1600px) {
    :root {
      --grid-margin: 32px;
      --grid-gutter: 24px;
      --grid-cols: 12;
      --grid-container-max: min(100%, 1264px);
    }
  }
  /* ── 다크모드 (analytics-projects.html 전용, 2026-09-09 신설) ──
     OS 설정 자동추종(prefers-color-scheme) 대신 상단 토글 버튼으로 수동 전환.
     Chords_editor 앱은 강제 라이트(다크 차단) 정책이지만, 이 관리자 도구는
     실제 다크 팔레트로 대응한다 — 별개 사이트라 앱의 차단 컨벤션 안 따름. */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16181A;
    --surface: #1E2124;
    --border: #33373C;
    --gray-light: #26292D;
    --text-primary: #F2F1EF;
    --text-secondary: #B5AFA8;
    --text-muted: #7C766F;
    --accent: #FF6B5E;
    --blue: #6C93FF;
    --brand: #FFFFFF;
    --db-card-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
    --chart-grid: rgba(255, 255, 255, 0.18);
    --funnel-1: rgba(255, 255, 255, 0.15);
    --funnel-2: rgba(255, 255, 255, 0.35);
    --funnel-3: rgba(255, 255, 255, 0.6);
    --funnel-4: #FFFFFF;
  }

  .db-theme-toggle {
    font-family: inherit;
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--gray-light);
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    margin-left: auto;
  }
  .db-theme-toggle:hover { color: var(--text-primary); }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .db-wrap {
    max-width: var(--grid-container-max);
    margin-inline: auto;
    padding: var(--grid-margin);
  }

  .db-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .db-title { font-size: 20px; font-weight: 700; margin: 0; }
  .db-updated { font-size: 13px; color: var(--text-muted); }

  .db-tabs { display: flex; gap: 16px; margin-bottom: 24px; }
  .db-tabs a {
    font-size: 14px;
    color: var(--text-secondary);
    text-decoration: none;
    padding-bottom: 6px;
    border-bottom: 2px solid transparent;
  }
  .db-tabs a.active { color: var(--text-primary); font-weight: 700; border-bottom-color: var(--text-primary); }

  .db-grid {
    display: grid;
    grid-template-columns: repeat(var(--grid-cols), 1fr);
    gap: var(--grid-gutter);
  }

  /* 섹션은 코드(FN_SECTIONS)에서 정의 — 사용자가 타이틀 입력해 만들던 방식 폐기 */
  .fn-section-list {
    grid-column: span var(--grid-cols);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .fn-section-chip {
    display: flex;
    align-items: center;
    background: var(--surface);
    box-shadow: var(--db-card-shadow);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .fn-section-chip.active { background: var(--text-primary); color: var(--bg); }

  .fn-content {
    grid-column: span var(--grid-cols);
    background: var(--surface);
    box-shadow: var(--db-card-shadow);
    border-radius: 16px;
    padding: 20px;
    display: none;
  }
  .fn-content.active { display: block; }
  .fn-content-title { font-size: 16px; font-weight: 700; margin: 0 0 16px; }
  .fn-content-body {
    aspect-ratio: 1.618 / 1; /* 골든비율 — 차트 영역 자체에만 적용 */
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── 데일리미션 분석 프로젝트: KPI 타일 (1차 디자인, 값은 정적 — 9/8 실측치) ──
     fn-content-body를 그대로 재사용 — 골든비율/flex-center는 KPI 모드에서 해제 */
  .fn-content-body.fn-kpi-mode {
    aspect-ratio: auto;
    display: block;
    max-width: 600px;
    color: var(--text-primary);
  }
  /* 모바일 기본: KPI 위 / 시계열 아래 세로 스택 */
  .fn-kpi-layout { display: flex; flex-direction: column; gap: 20px; }
  /* 데스크탑: KPI 좌측 / 시계열 우측 2단 배치라 600px 캡 해제 */
  @media (min-width: 1600px) {
    .fn-content-body.fn-kpi-mode { max-width: none; }
    .fn-kpi-layout { flex-direction: row; align-items: flex-start; gap: 24px; }
    .fn-kpi-left { flex: 1; min-width: 0; }
    .fn-kpi-right { flex: 1; min-width: 0; }
  }
  .fn-kpi-hero {
    /* 라이트/다크 안 타는 고정 다크카드 — text-primary/bg는 다크모드에서 서로 뒤집혀서
       하얗게 반전돼버림(2026-09-10 확인), 강조카드는 항상 어두운 배경을 유지해야 함 */
    background: #242729;
    color: #FAFAF9;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .fn-kpi-hero-label { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 8px; }
  .fn-kpi-hero-value { font-size: 40px; font-weight: 700; line-height: 1; }
  .fn-kpi-hero-value span { font-size: 18px; font-weight: 600; margin-left: 4px; color: rgba(255,255,255,0.8); }
  .fn-kpi-hero-sub { font-size: 13px; color: rgba(255,255,255,0.65); margin-top: 10px; }

  .fn-kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .fn-kpi-tile {
    background: var(--gray-light);
    border-radius: 12px;
    padding: 16px;
  }
  .fn-kpi-tile-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.3; }
  .fn-kpi-tile-value { font-size: 26px; font-weight: 700; white-space: nowrap; }
  .fn-kpi-tile-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  /* 모바일도 2x2 유지 — 폭이 좁아지는 만큼 패딩/폰트만 축소 */
  @media (max-width: 480px) {
    .fn-kpi-hero { padding: 16px; }
    .fn-kpi-hero-value { font-size: 32px; }
    .fn-kpi-grid { gap: 8px; }
    .fn-kpi-tile { padding: 10px; border-radius: 10px; }
    .fn-kpi-tile-label { font-size: 11px; margin-bottom: 4px; }
    .fn-kpi-tile-value { font-size: 19px; }
    .fn-kpi-tile-sub { font-size: 10px; margin-top: 4px; }
  }

  .db-card {
    background: var(--surface);
    box-shadow: var(--db-card-shadow);
    border-radius: 16px;
    padding: 20px;
    grid-column: span var(--grid-cols);
    min-height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* 그리드 오버레이 — G키로 토글, 컬럼 정렬 디버그용 */
  .grid-overlay {
    display: none;
    position: fixed;
    inset: 0;
    max-width: var(--grid-container-max);
    margin-inline: auto;
    padding-inline: var(--grid-margin);
    grid-template-columns: repeat(var(--grid-cols), 1fr);
    gap: var(--grid-gutter);
    z-index: 9999;
    pointer-events: none;
  }
  .grid-overlay.active { display: grid; }
  .grid-overlay > div {
    height: 100%;
    background: rgba(79, 124, 255, 0.12);
    outline: 1px solid rgba(79, 124, 255, 0.4);
  }

  /* ── 관리자 로그인 게이트 (dashboard.html과 동일) ── */
  #db-gate {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  #db-gate[hidden] { display: none !important; }
  .db-gate-card {
    width: 100%; max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .db-gate-title { font-size: 20px; font-weight: 600; color: var(--text-primary); margin: 0; }
  .db-gate-card button {
    font-family: inherit; font-size: 16px; font-weight: 600;
    padding: 12px; border: 0; border-radius: 8px;
    background: var(--text-primary); color: var(--bg); cursor: pointer;
  }
  .db-gate-card button:disabled { opacity: .5; cursor: default; }
  .db-gate-err { font-size: 13px; color: var(--accent); min-height: 18px; margin: 0; }
  #db-signout {
    font-family: inherit; font-size: 13px; color: var(--text-secondary);
    background: none; border: 0; cursor: pointer; text-decoration: underline;
  }

  /* ── 시계열 차트 — dashboard.html db-chart-* 패턴 그대로 재사용 ──
     상단 여백은 fn-kpi-layout의 gap이 담당(좌우 배치 fn-kpi-right 안에 단독으로 들어가므로) */
  .fn-chart-wrap { margin-top: 0; }
  .db-chart-header { display: flex; align-items: center; justify-content: space-between; }
  .db-chart-title { font-size: 16px; font-weight: 700; margin: 0; }
  .db-chart-select {
    font-family: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--gray-light); border: none; border-radius: 8px; padding: 6px 10px;
  }
  .db-chart-body {
    aspect-ratio: 1.618 / 1;
    position: relative;
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .db-chart-body canvas { width: 100% !important; height: 100% !important; }
  .db-chart-legend-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; row-gap: 8px; flex-shrink: 0;
    padding-top: 12px; position: relative;
  }
  .db-chart-legend {
    display: flex; flex-wrap: wrap; row-gap: 6px; gap: 16px;
    font-size: 12px; color: var(--text-secondary);
  }
  .db-legend-item { display: flex; align-items: center; gap: 6px; }
  .db-legend-item--off { color: var(--text-muted); }
  .db-legend-dot { width: 8px; height: 8px; flex-shrink: 0; }
  .db-legend-toggle-btn {
    font-family: inherit; font-size: 12px; color: var(--text-secondary);
    background: var(--gray-light); border: none; border-radius: 8px;
    padding: 5px 10px; cursor: pointer;
  }
  .db-legend-menu {
    display: none; position: absolute; right: 0; bottom: calc(100% + 8px);
    background: var(--surface); box-shadow: var(--db-card-shadow);
    border-radius: 12px; padding: 10px; z-index: 10; min-width: 160px;
  }
  .db-legend-menu.open { display: block; }
  .db-legend-menu label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 6px 4px; cursor: pointer;
  }
  .fn-chart-note { font-size: 12px; color: var(--text-muted); margin: 8px 0 0; }

  /* ── 7일 체험 실험 프로젝트: 목업(trial-experiment-mockup.html)에서 이식 ──
     nested box-shadow 대신 기존 fn-kpi-tile 패턴처럼 플랫 패널(테두리)로 통일 */
  .fn-trial-grid { display: grid; grid-template-columns: repeat(var(--grid-cols), 1fr); gap: var(--grid-gutter); }
  .fn-trial-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    grid-column: span var(--grid-cols);
  }
  @media (min-width: 1600px) {
    .fn-trial-panel--half { grid-column: span 6; }
  }
  .fn-trial-panel-title { font-size: 14px; font-weight: 700; margin: 0; }
  .fn-trial-panel-sub { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }

  .fn-trial-progress-row { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 8px; }
  .fn-trial-progress-num { font-size: 34px; font-weight: 700; }
  .fn-trial-progress-goal { font-size: 16px; color: var(--text-muted); }
  .fn-trial-progress-track { width: 100%; height: 12px; background: var(--gray-light); border-radius: 999px; overflow: hidden; }
  .fn-trial-progress-fill { height: 100%; background: var(--brand); border-radius: 999px; transition: width 0.6s ease; }
  .fn-trial-progress-note { font-size: 11px; color: var(--text-muted); margin: 8px 0 0; }

  #fn-trial-funnel-wrap { flex: 1; min-height: 200px; margin-top: 12px; }


  .fn-trial-cohort-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 12px; }
  @media (max-width: 599px) { .fn-trial-cohort-grid { grid-template-columns: 1fr; } }
  .fn-trial-cohort-sub { display: flex; flex-direction: column; }
  .fn-trial-cohort-sub-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin: 0 0 6px; }
  .fn-trial-cohort-sub .fn-trial-chart-body { aspect-ratio: 1.9 / 1; }
  .fn-trial-chart-body { position: relative; }
  .fn-trial-chart-body canvas { width: 100% !important; height: 100% !important; }
</style>
</head>
<body>

<div id="db-gate">
  <div class="db-gate-card">
    <h1 class="db-gate-title">관리자 로그인</h1>
    <button type="button" id="db-login-btn">Google로 로그인</button>
    <p class="db-gate-err" id="db-gate-err"></p>
  </div>
</div>

<div class="db-wrap">
  <div class="db-header">
    <h1 class="db-title">분석 프로젝트</h1>
    <span class="db-updated" id="db-updated">마지막 갱신: --</span>
    <button type="button" id="db-signout">로그아웃</button>
  </div>

  <nav class="db-tabs">
    <a href="dashboard.html">대시보드</a>
    <a href="analytics-projects.html" class="active">분석 프로젝트</a>
    <button type="button" class="db-theme-toggle" id="db-theme-toggle">🌙 다크모드</button>
  </nav>

  <div class="db-grid">
    <div class="fn-section-list" id="fn-section-list"></div>
    <div class="fn-content" id="fn-content">
      <h2 class="fn-content-title" id="fn-content-title"></h2>
      <div class="fn-content-body" id="fn-content-body"></div>
    </div>
  </div>
</div>

<script>
  // ── Supabase 인증 (dashboard.html과 동일 — supabase-js는 인증 전용, 조회는 raw fetch) ──
  const SUPABASE_URL = 'https://jbvkygeksohlysyvaoab.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impidmt5Z2Vrc29obHlzeXZhb2FiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzOTk5NjgsImV4cCI6MjA5MTk3NTk2OH0.6RSgChy0Yq0H2TJpZPSoMKQ2V-OYfR0XzE1aJBBZkXI';
  const sbAuth = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Chart.js 전역 색상 — CSS 변수(다크모드 토글 시 [data-theme=dark]가 재정의)에서 읽어옴,
  //    JS는 getComputedStyle로만 읽고 색상값 자체는 CSS를 단일 소스로 삼음 ──
  function fnCssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  Chart.defaults.font = { family: 'Pretendard', size: 12 };
  // 토글로 테마 바뀔 때마다 다시 읽어야 하므로 const 아닌 함수로 — 차트는 매번 재생성되니
  // 생성 시점의 현재 값을 그때그때 읽어온다.
  function fnApplyChartThemeDefaults() {
    Chart.defaults.color = fnCssVar('--text-secondary');
  }
  fnApplyChartThemeDefaults();
  function CHART_GRID_COLOR_FN() { return fnCssVar('--chart-grid'); }

  // ── 옛 데일리미션 KPI (종료, 2026-11-09 고정) ──────────────────────
  //   옛 구조(1.3.5~1.3.x: 관문→세션→오답풀이)는 1.4.0(11/3) 오늘의 미션 개편으로 끝남.
  //   측정 기간 9/2~11/2 고정. 11/3 이후 행은 분모 DAU(1.3.5+)에 새 구조 유저가 섞여 오염돼 안 읽음.
  //   KPI 타일 = 기간 합산(분자 합 / 분모 합, 단위 명·일). 실시간 mission_funnel_today() 호출 제거.
  const MISSION_OLD_FROM = '2026-09-02';
  const MISSION_OLD_TO = '2026-11-02';
  let fnFunnelChart = null;
  let fnCachedHistory = null; // 테마 토글 시 재조회 없이 차트만 다시 그리는 용도

  function fnPct(num, den) {
    return den > 0 ? Math.round((num / den) * 1000) / 10 : null;
  }

  async function fnFetchAuthedJson(url, session, opts) {
    const resp = await fetch(url, {
      ...opts,
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${session.access_token}`,
        ...(opts && opts.headers),
      },
    });
    if (!resp.ok) {
      const err = new Error(`${url} → ${resp.status}`);
      err.status = resp.status;
      throw err;
    }
    return resp.json();
  }

  async function fnRenderMissionFunnelKPI(bodyEl) {
    bodyEl.innerHTML = `<div class="fn-kpi-hero"><div class="fn-kpi-hero-label">불러오는 중…</div></div>`;

    let history;
    const { data: { session } } = await sbAuth.auth.getSession();
    if (!session) { bodyEl.textContent = '로그인이 필요합니다.'; return; }

    try {
      history = await fnFetchAuthedJson(
        `${SUPABASE_URL}/rest/v1/mission_funnel_history?select=*` +
        `&day=gte.${MISSION_OLD_FROM}&day=lte.${MISSION_OLD_TO}&order=day.asc`, session);
    } catch (e) {
      // 관리자 uid가 아니면 mission_funnel_history 조회가 RLS에 막힘 — 세션을 끊어야
      // 다른 계정으로 재시도 가능(dashboard.html과 동일 정책).
      if ([400, 401, 403].includes(e.status)) {
        await sbAuth.auth.signOut();
        showGate('이 계정에는 조회 권한이 없습니다.');
        return;
      }
      bodyEl.textContent = '데이터를 불러오지 못했습니다: ' + e.message;
      return;
    }

    if (!history.length) { bodyEl.textContent = `${MISSION_OLD_FROM}~${MISSION_OLD_TO} 집계 행이 없습니다.`; return; }
    fnCachedHistory = history;
    // 기간 합산 — 컬럼이 없는 테이블이면 null(광고 컬럼은 존재 여부를 확인 못 해서 있을 때만 표시)
    const sumOf = (key) => (key in history[0] ? history.reduce((a, r) => a + (Number(r[key]) || 0), 0) : null);
    const sum = {
      dau_135: sumOf('dau_135'), gate_viewed: sumOf('gate_viewed'), gate_start: sumOf('gate_start'),
      completed: sumOf('completed'), ad_watched: sumOf('ad_watched'), ad_eligible: sumOf('ad_eligible'),
    };
    const fmt = (n) => (n == null ? '-' : n.toLocaleString());
    const tiles = [
      { label: '미션 완료율 (완주/대상유저)', pct: fnPct(sum.completed, sum.dau_135), num: sum.completed, den: sum.dau_135 },
      { label: '관문 노출률 (노출/대상유저)', pct: fnPct(sum.gate_viewed, sum.dau_135), num: sum.gate_viewed, den: sum.dau_135 },
      { label: '관문 통과율 (시작/노출)', pct: fnPct(sum.gate_start, sum.gate_viewed), num: sum.gate_start, den: sum.gate_viewed },
      { label: '세션 완주율 (완주/시작)', pct: fnPct(sum.completed, sum.gate_start), num: sum.completed, den: sum.gate_start },
    ];
    const hasAd = sum.ad_watched != null && sum.ad_eligible != null;
    const adPct = hasAd ? fnPct(sum.ad_watched, sum.ad_eligible) : null;
    const periodLabel = `${MISSION_OLD_FROM} ~ ${MISSION_OLD_TO} 합산 · 종료(1.4.0 오늘의 미션으로 개편)`;

    bodyEl.innerHTML = `
      <div class="fn-kpi-layout">
        <div class="fn-kpi-left">
          <div class="fn-kpi-hero">
            ${hasAd ? `
            <div class="fn-kpi-hero-label">광고 시청 (2배 보상, clear+review 합산)</div>
            <div class="fn-kpi-hero-value">${fmt(sum.ad_watched)}<span>건</span></div>
            <div class="fn-kpi-hero-sub">완주 ${fmt(sum.ad_eligible)}건 중 ${adPct ?? '-'}% 시청 완료 · ${periodLabel}</div>
            ` : `
            <div class="fn-kpi-hero-label">옛 데일리미션 (관문 → 세션 → 오답풀이)</div>
            <div class="fn-kpi-hero-value">${fnPct(sum.completed, sum.dau_135) ?? '-'}<span>%</span></div>
            <div class="fn-kpi-hero-sub">미션 완료율 · ${periodLabel}</div>
            `}
          </div>
          <div class="fn-kpi-grid">
            ${tiles.map((t) => `
              <div class="fn-kpi-tile">
                <div class="fn-kpi-tile-label">${t.label}</div>
                <div class="fn-kpi-tile-value">${t.pct ?? '-'}%</div>
                <div class="fn-kpi-tile-sub">${fmt(t.num)} / ${fmt(t.den)}명·일</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="fn-kpi-right">
          <div class="fn-chart-wrap">
            <div class="db-chart-header">
              <h3 class="db-chart-title">일별 추세</h3>
              <select class="db-chart-select" id="fn-chart-range">
                <option value="all">전체</option>
                <option value="7">7일</option>
                <option value="30">30일</option>
                <option value="180">6개월</option>
              </select>
            </div>
            <div class="db-chart-body"><canvas id="fn-funnel-chart"></canvas></div>
            <div class="db-chart-legend-row">
              <div class="db-chart-legend" id="fn-chart-legend"></div>
              <button class="db-legend-toggle-btn" id="fn-chart-menu-btn">지표 선택</button>
              <div class="db-legend-menu" id="fn-chart-menu">
                ${Object.entries(FN_SERIES_META).map(([key, m]) => `
                  <label><input type="checkbox" value="${key}" checked> ${m.label}</label>
                `).join('')}
              </div>
            </div>
            <p class="fn-chart-note">${MISSION_OLD_FROM} ~ ${MISSION_OLD_TO} 고정 · 이후는 분모 오염으로 제외</p>
          </div>
        </div>
      </div>
    `;

    document.getElementById('fn-chart-menu-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('fn-chart-menu').classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (e.target.closest('#fn-chart-menu')) return; // 메뉴 내부(체크박스 등) 클릭은 안 닫음
      document.getElementById('fn-chart-menu')?.classList.remove('open');
    });
    document.querySelectorAll('#fn-chart-menu input').forEach((cb) => {
      cb.addEventListener('change', () => fnRenderFunnelChart(history));
    });
    document.getElementById('fn-chart-range').addEventListener('change', () => fnRenderFunnelChart(history));

    fnRenderFunnelChart(history);
  }

  // dashboard.html rowsInRange()와 동일 — 'all'이면 전체, 아니면 최근 N일
  function fnRowsInRange(rangeVal, rows) {
    if (rangeVal === 'all') return rows;
    const n = parseInt(rangeVal, 10);
    return rows.slice(-n);
  }

  // dashboard.html SERIES_META와 동일한 형태 — 색상은 style-guide.md §1 아이콘 컬러 재사용
  const FN_SERIES_META = {
    completion:       { label: '완료율',     color: '#e03c31', val: (r) => fnPct(r.completed, r.dau_135) },
    gate_view:        { label: '관문노출률',  color: '#4f7cff', val: (r) => fnPct(r.gate_viewed, r.dau_135) },
    gate_pass:        { label: '관문통과율',  color: '#2E9E72', val: (r) => fnPct(r.gate_start, r.gate_viewed) },
    session_complete: { label: '세션완주율',  color: '#E8C000', val: (r) => fnPct(r.completed, r.gate_start) },
  };

  function fnRenderChartLegend() {
    const checked = new Set(Array.from(document.querySelectorAll('#fn-chart-menu input:checked')).map((el) => el.value));
    const legend = document.getElementById('fn-chart-legend');
    legend.innerHTML = Object.entries(FN_SERIES_META).map(([key, m]) => {
      const on = checked.has(key);
      const dotColor = on ? m.color : 'var(--border)';
      return `<span class="db-legend-item${on ? '' : ' db-legend-item--off'}">` +
        `<span class="db-legend-dot" style="background:${dotColor};"></span>${m.label}</span>`;
    }).join('');
  }

  function fnRenderFunnelChart(allRows) {
    fnRenderChartLegend();
    const rangeVal = document.getElementById('fn-chart-range').value;
    const rows = fnRowsInRange(rangeVal, allRows);
    const checked = Array.from(document.querySelectorAll('#fn-chart-menu input:checked')).map((el) => el.value);

    const datasets = checked.map((key) => {
      const m = FN_SERIES_META[key];
      return {
        label: m.label,
        data: rows.map((r) => m.val(r)),
        borderColor: m.color,
        backgroundColor: m.color,
        tension: 0,
        pointRadius: 0,
        borderWidth: 2,
      };
    });

    if (fnFunnelChart) fnFunnelChart.destroy();
    fnFunnelChart = new Chart(document.getElementById('fn-funnel-chart'), {
      type: 'line',
      data: { labels: rows.map((r) => r.day), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (item) => `${item.dataset.label}: ${item.parsed.y.toFixed(1)}%` } },
        },
        scales: {
          x: { grid: { color: CHART_GRID_COLOR_FN() }, ticks: { maxTicksLimit: 8 } },
          y: { min: 0, grid: { color: CHART_GRID_COLOR_FN() }, ticks: { callback: (v) => v + '%' } },
        },
      },
    });
  }

  // ── 오늘의 미션 (1.4+ 새 구조) — 출석 달성률 ───────────────────────
  //   출석 달성률 = 그날 daily_mission_attended 유저 / 앱 버전 1.4 이상 DAU. 완료 여부만 본다.
  //   일별 값은 daily_mission_attend_daily 스냅샷(supabase/daily_mission_attend_daily.sql, 크론 매시 5분)에서 읽음.
  //   11/3은 점진 배포 첫날(1.4 DAU 1명)이라 11/4부터 표시. 오늘 행은 집계 중이라 합계·타일에서 제외하고 차트에만 그린다.
  const ATTEND_FROM = '2026-11-04';
  let fnAttendChart = null;
  let fnAttendRows = null;   // 테마 토글 시 재조회 없이 차트만 다시 그리는 용도

  function fnKstToday() {
    return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
  }

  function fnRenderAttendChart(rows) {
    if (fnAttendChart) fnAttendChart.destroy();
    const color = '#4f7cff';
    fnAttendChart = new Chart(document.getElementById('fn-attend-chart'), {
      type: 'line',
      data: {
        labels: rows.map((r) => r.day),
        datasets: [{
          label: '출석 달성률',
          data: rows.map((r) => fnPct(r.attended, r.dau)),
          borderColor: color, backgroundColor: color, tension: 0, pointRadius: 3, borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (item) => {
                const r = rows[item.dataIndex];
                return `출석 달성률 ${item.parsed.y == null ? '-' : item.parsed.y.toFixed(1)}% (${r.attended}/${r.dau}명)`;
              },
            },
          },
        },
        scales: {
          x: { grid: { color: CHART_GRID_COLOR_FN() }, ticks: { maxTicksLimit: 8 } },
          y: { min: 0, grid: { color: CHART_GRID_COLOR_FN() }, ticks: { callback: (v) => v + '%' } },
        },
      },
    });
  }

  async function fnRenderAttend(bodyEl) {
    bodyEl.innerHTML = `<div class="fn-kpi-hero"><div class="fn-kpi-hero-label">불러오는 중…</div></div>`;
    const { data: { session } } = await sbAuth.auth.getSession();
    if (!session) { bodyEl.textContent = '로그인이 필요합니다.'; return; }

    let rows;
    try {
      rows = await fnFetchAuthedJson(
        `${SUPABASE_URL}/rest/v1/daily_mission_attend_daily?select=day,dau,attended` +
        `&day=gte.${ATTEND_FROM}&order=day.asc`, session);
    } catch (e) {
      if ([400, 401, 403].includes(e.status)) {
        await sbAuth.auth.signOut();
        showGate('이 계정에는 조회 권한이 없습니다.');
        return;
      }
      bodyEl.textContent = '데이터를 불러오지 못했습니다: ' + e.message;
      return;
    }
    if (!rows.length) { bodyEl.textContent = `${ATTEND_FROM} 이후 집계 행이 없습니다. (daily_mission_attend_daily.sql 실행 여부 확인)`; return; }
    fnAttendRows = rows;

    const today = fnKstToday();
    const done = rows.filter((r) => r.day < today);   // 오늘(집계 중) 제외
    const fmt = (n) => (n == null ? '-' : n.toLocaleString());
    const sumAttended = (arr) => arr.reduce((a, r) => a + (Number(r.attended) || 0), 0);
    const sumDau = (arr) => arr.reduce((a, r) => a + (Number(r.dau) || 0), 0);
    const last7 = done.slice(-7);
    const yesterday = done[done.length - 1];
    const tiles = [
      { label: '최근 7일 (출석/DAU)', pct: fnPct(sumAttended(last7), sumDau(last7)), sub: `${fmt(sumAttended(last7))} / ${fmt(sumDau(last7))}명·일` },
      { label: yesterday ? `${yesterday.day.slice(5)} (가장 최근 완료일)` : '가장 최근 완료일',
        pct: yesterday ? fnPct(yesterday.attended, yesterday.dau) : null,
        sub: yesterday ? `${fmt(yesterday.attended)} / ${fmt(yesterday.dau)}명` : '-' },
      { label: '출석 달성 누적', pct: null, sub: `${fmt(sumAttended(done))}명·일`, raw: fmt(sumAttended(done)) },
      { label: '1.4+ DAU 누적', pct: null, sub: `${fmt(sumDau(done))}명·일`, raw: fmt(sumDau(done)) },
    ];
    const periodLabel = done.length ? `${done[0].day} ~ ${done[done.length - 1].day} 합산 (오늘 제외)` : '완료된 날 없음';

    bodyEl.innerHTML = `
      <div class="fn-kpi-layout">
        <div class="fn-kpi-left">
          <div class="fn-kpi-hero">
            <div class="fn-kpi-hero-label">출석 달성률 (필수 미션 2개 완료 = 출석 도장)</div>
            <div class="fn-kpi-hero-value">${fnPct(sumAttended(done), sumDau(done)) ?? '-'}<span>%</span></div>
            <div class="fn-kpi-hero-sub">앱 버전 1.4 이상 DAU 대비 · ${periodLabel}</div>
          </div>
          <div class="fn-kpi-grid">
            ${tiles.map((t) => `
              <div class="fn-kpi-tile">
                <div class="fn-kpi-tile-label">${t.label}</div>
                <div class="fn-kpi-tile-value">${t.pct != null ? t.pct + '%' : (t.raw ?? '-')}</div>
                <div class="fn-kpi-tile-sub">${t.sub}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="fn-kpi-right">
          <div class="fn-chart-wrap">
            <div class="db-chart-header"><h3 class="db-chart-title">일별 출석 달성률</h3></div>
            <div class="db-chart-body"><canvas id="fn-attend-chart"></canvas></div>
            <p class="fn-chart-note">${ATTEND_FROM}부터 표시 · 11/3은 점진 배포 첫날(분모 1명)이라 제외 · 오늘 값은 집계 중(합계·타일에서 제외)</p>
          </div>
        </div>
      </div>
    `;
    fnRenderAttendChart(rows);
  }

  // ── 7일 체험 만료 후 전환율 실험 (종료, 2026-11-09 결과 고정) ──────────
  //   문서: docs/trial-experiment-dashboard-plan.md §3(3카드) / §7-3(스냅샷) / §8(모델)
  //   정지조건 300명 달성 = 2026-09-29 07:55 KST(300번째 클레임 9/22 07:55 + 7일).
  //   결과 = 달성 직후 첫 크론 스냅샷(day=2026-09-30, 05:10 KST) 고정. 실시간 진행카운터·수동갱신 제거.
  //   이후 스냅샷은 analytics_events 30일 롤링 삭제로 재접속·알림 수가 줄어들어 쓰면 안 됨.
  //   숫자를 HTML에 박지 않는 이유: 페이지가 공개(GitHub Pages)라 RLS 보호 테이블에서 읽음.
  //   결제(알림경유)는 전 기간 0명 — 실제 결과(측정 오류 아님, 사용자 확인). 그래서 코호트는 재접속률·알림노출률로 비교.
  const TRIAL_RESULT_DAY = '2026-09-30';
  const TRIAL_REACHED_AT = '2026-09-29 07:55 KST';
  let fnTrialData = null;   // { day, rows, progress } — 테마 토글 시 재조회 없이 재렌더용
  let fnTrialCharts = [];   // Chart 인스턴스 추적 → 재렌더 전 destroy

  async function fnRenderTrialExperiment(bodyEl) {
    bodyEl.innerHTML = '<p style="color:var(--text-muted);font-size:14px;">불러오는 중…</p>';
    const { data: { session } } = await sbAuth.auth.getSession();
    if (!session) { bodyEl.textContent = '로그인이 필요합니다.'; return; }

    try {
      const rows = await fnFetchAuthedJson(
        `${SUPABASE_URL}/rest/v1/trial_experiment_funnel_daily` +
        `?select=segment_type,segment_key,claimed,reopened,notice_shown,converted&day=eq.${TRIAL_RESULT_DAY}`, session);
      if (!rows.length) { bodyEl.textContent = `결과 스냅샷(${TRIAL_RESULT_DAY})을 찾지 못했습니다.`; return; }
      fnTrialData = { day: TRIAL_RESULT_DAY, rows, progress: 300 };
    } catch (e) {
      // 401/403만 인증실패로 처리(400은 미배포·쿼리오류일 수 있어 실제 메시지를 보여줌)
      if ([401, 403].includes(e.status)) {
        await sbAuth.auth.signOut();
        showGate('이 계정에는 조회 권한이 없습니다.');
        return;
      }
      bodyEl.textContent = '데이터를 불러오지 못했습니다: ' + e.message;
      return;
    }

    fnRenderTrialCharts(bodyEl, fnTrialData);
  }

  // 마크업 + 차트 렌더만 — 네트워크 없음. 테마 토글 시 이것만 다시 부름.
  function fnRenderTrialCharts(bodyEl, dataObj) {
    fnTrialCharts.forEach((c) => c.destroy());
    fnTrialCharts = [];

    const rows = dataObj.rows;
    const PROGRESS_GOAL = 300;
    const progress = dataObj.progress;

    const overall = rows.find((r) => r.segment_type === 'overall')
      || { claimed: 0, reopened: 0, notice_shown: 0, converted: 0 };
    const FUNNEL_LABELS = ['클레임', '재접속', '알림노출', '결제(알림경유)'];
    const FUNNEL_VALUES = [overall.claimed, overall.reopened, overall.notice_shown, overall.converted];
    const base = FUNNEL_VALUES[0] || 0;
    const FUNNEL_PCTS = FUNNEL_VALUES.map((v) => (base > 0 ? +(v / base * 100).toFixed(1) : 0));
    const FUNNEL_COLORS = [fnCssVar('--funnel-1'), fnCssVar('--funnel-2'), fnCssVar('--funnel-3'), fnCssVar('--funnel-4')];

    bodyEl.innerHTML = `
      <div class="fn-trial-grid">
        <div class="fn-trial-panel fn-trial-panel--half">
          <h3 class="fn-trial-panel-title">실험 종료</h3>
          <p class="fn-trial-panel-sub">만료자 ${PROGRESS_GOAL}명 달성 · ${TRIAL_REACHED_AT}</p>
          <div class="fn-trial-progress-row">
            <span class="fn-trial-progress-num">${progress}</span>
            <span class="fn-trial-progress-goal">/ ${PROGRESS_GOAL}</span>
          </div>
          <div class="fn-trial-progress-track"><div class="fn-trial-progress-fill" id="fn-trial-progress-fill" style="width:0%"></div></div>
          <p class="fn-trial-progress-note">결과는 달성 직후 스냅샷(${dataObj.day} 05:10 KST) 고정값입니다. 그 시점 클레임 전원(${overall.claimed.toLocaleString()}명, 체험 중 포함) 기준이며, 알림경유 결제는 0명입니다.</p>
        </div>

        <div class="fn-trial-panel fn-trial-panel--half">
          <h3 class="fn-trial-panel-title">체험판 전환 퍼널</h3>
          <p class="fn-trial-panel-sub">클레임 → 재접속 → 알림노출 → 결제(알림경유)</p>
          <div class="fn-trial-chart-body" id="fn-trial-funnel-wrap"></div>
        </div>

        <div class="fn-trial-panel">
          <h3 class="fn-trial-panel-title">코호트별 재접속률 · 알림노출률</h3>
          <p class="fn-trial-panel-sub">그룹별 재접속 / 클레임, 만료알림 노출 / 클레임(%) · 결제는 전 그룹 0명이라 비교에서 제외</p>
          <div class="fn-trial-cohort-grid">
            <div class="fn-trial-cohort-sub">
              <p class="fn-trial-cohort-sub-title">성별</p>
              <div class="fn-trial-chart-body"><canvas id="fn-trial-cohort-gender"></canvas></div>
            </div>
            <div class="fn-trial-cohort-sub">
              <p class="fn-trial-cohort-sub-title">나이대</p>
              <div class="fn-trial-chart-body"><canvas id="fn-trial-cohort-age"></canvas></div>
            </div>
            <div class="fn-trial-cohort-sub">
              <p class="fn-trial-cohort-sub-title">페르소나</p>
              <div class="fn-trial-chart-body"><canvas id="fn-trial-cohort-persona"></canvas></div>
            </div>
            <div class="fn-trial-cohort-sub">
              <p class="fn-trial-cohort-sub-title">피크소진 횟수구간</p>
              <div class="fn-trial-chart-body"><canvas id="fn-trial-cohort-peak"></canvas></div>
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('fn-trial-progress-fill').style.width =
      Math.min(100, PROGRESS_GOAL > 0 ? progress / PROGRESS_GOAL * 100 : 0) + '%';

    // ── 퍼널 SVG: 로그스케일 너비(값 0이어도 안 깨지게 clamp), 라벨 좌측고정 / 막대 우측레인 중앙정렬 ──
    function buildFunnelSVG() {
      const wrap = document.getElementById('fn-trial-funnel-wrap');
      if (!wrap) return;
      const n = FUNNEL_VALUES.length;
      const rect = wrap.getBoundingClientRect();
      const W = rect.width, bandH = rect.height / n, H = rect.height;
      const barLaneStart = W * 0.46;
      const barLaneW = W - barLaneStart;
      const safeLog = (v) => Math.log10(Math.max(v, 1));
      const logs = FUNNEL_VALUES.map(safeLog);
      const maxLog = Math.max(...logs), minLog = Math.min(...logs);
      const minW = barLaneW * 0.18, maxW = barLaneW * 0.96;
      const widthFor = (v) => {
        if (maxLog === minLog) return maxW;
        return minW + (safeLog(v) - minLog) / (maxLog - minLog) * (maxW - minW);
      };
      const widths = FUNNEL_VALUES.map(widthFor);

      let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif">`;
      FUNNEL_LABELS.forEach((label, i) => {
        const barW = widths[i];
        const barX = barLaneStart + (barLaneW - barW) / 2;
        const y0 = i * bandH, y1 = y0 + bandH;
        const midY = y0 + bandH / 2;
        svg += `<polygon points="${barX},${y0} ${barX + barW},${y0} ${barX + barW},${y1} ${barX},${y1}" fill="${FUNNEL_COLORS[i]}" />`;
        svg += `<text x="0" y="${midY - 4}" text-anchor="start" font-size="12" font-weight="600" fill="var(--text-secondary)">${label}</text>`;
        svg += `<text x="0" y="${midY + 18}" text-anchor="start" font-size="20" font-weight="300" fill="var(--text-primary)">${FUNNEL_VALUES[i].toLocaleString()}<tspan font-size="11" font-weight="400" dx="4" fill="var(--text-secondary)">${FUNNEL_PCTS[i]}%</tspan></text>`;
      });
      svg += '</svg>';
      wrap.innerHTML = svg;
    }
    buildFunnelSVG();
    if (window._fnFunnelResizeHandler) window.removeEventListener('resize', window._fnFunnelResizeHandler);
    window._fnFunnelResizeHandler = buildFunnelSVG;
    window.addEventListener('resize', window._fnFunnelResizeHandler);

    // ── 코호트 4섹션 (segment_type별 묶음 막대 2개: 재접속률·알림노출률, 툴팁에 인원/클레임) ──
    const MISC = '미상';
    const byType = (t) => rows.filter((r) => r.segment_type === t);
    const ratePct = (r, key) => (r.claimed > 0 ? +(r[key] / r.claimed * 100).toFixed(1) : 0);
    function sortRows(list, order) {
      if (order) {
        return [...list].sort((a, b) => {
          const ia = order.indexOf(a.segment_key), ib = order.indexOf(b.segment_key);
          return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
        });
      }
      return [...list].sort((a, b) => {
        if (a.segment_key === MISC) return 1;
        if (b.segment_key === MISC) return -1;
        return b.claimed - a.claimed;
      });
    }
    const COHORT_SERIES = [
      { key: 'reopened', label: '재접속률', color: FUNNEL_COLORS[1] },
      { key: 'notice_shown', label: '알림노출률', color: FUNNEL_COLORS[2] },
    ];
    function cohortBarChart(canvasId, list) {
      const el = document.getElementById(canvasId);
      if (!el) return;
      const claims = list.map((r) => r.claimed);
      const ch = new Chart(el, {
        type: 'bar',
        data: {
          labels: list.map((r) => r.segment_key),
          datasets: COHORT_SERIES.map((s) => ({
            label: s.label,
            data: list.map((r) => ratePct(r, s.key)),
            counts: list.map((r) => r[s.key]),
            backgroundColor: s.color, borderRadius: 0, barPercentage: 0.8, categoryPercentage: 0.7,
          })),
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10, font: { size: 11 } } },
            tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label} ${ctx.raw}% (${ctx.dataset.counts[ctx.dataIndex]}/${claims[ctx.dataIndex]}명)` } },
          },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { color: CHART_GRID_COLOR_FN() }, ticks: { callback: (v) => v + '%' } },
          },
        },
      });
      fnTrialCharts.push(ch);
    }

    const AGE_ORDER = ['10대', '20대', '30대', '40대', '50대', '60대', '70대', '80대', '90대', MISC];
    const PEAK_ORDER = ['0회', '1~4회', '5~9회', '10회+'];
    cohortBarChart('fn-trial-cohort-gender', sortRows(byType('gender')));
    cohortBarChart('fn-trial-cohort-age', sortRows(byType('age'), AGE_ORDER));
    cohortBarChart('fn-trial-cohort-persona', sortRows(byType('persona')));
    cohortBarChart('fn-trial-cohort-peak', sortRows(byType('peak_bucket'), PEAK_ORDER));
  }

  // ── 섹션 정의 — 여기 배열에 항목을 추가/삭제하는 게 곧 "프로젝트 추가/삭제".
  // render가 없으면 자리표시 문구만 보여준다(신규 섹션 초안용).
  const FN_SECTIONS = [
    { id: 'mission-attend', title: '오늘의 미션 (1.4+) 출석 달성률', kpiMode: true, render: fnRenderAttend },
    { id: 'mission-funnel', title: '옛 데일리미션 분석 (9/2~11/2 종료)', kpiMode: true, render: fnRenderMissionFunnelKPI },
    { id: 'trial-experiment', title: '7일 체험 만료 후 전환율 실험', kpiMode: true, render: fnRenderTrialExperiment },
  ];

  let fnActiveId = FN_SECTIONS[0]?.id ?? null;

  function fnRenderSections() {
    const listEl = document.getElementById('fn-section-list');
    const contentEl = document.getElementById('fn-content');
    const bodyEl = document.getElementById('fn-content-body');

    listEl.innerHTML = FN_SECTIONS.map((s) => `
      <span class="fn-section-chip${s.id === fnActiveId ? ' active' : ''}" data-id="${s.id}">${s.title}</span>
    `).join('');

    const active = FN_SECTIONS.find((s) => s.id === fnActiveId);
    contentEl.classList.toggle('active', !!active);
    if (!active) return;

    document.getElementById('fn-content-title').textContent = active.title;
    bodyEl.classList.toggle('fn-kpi-mode', !!active.kpiMode);
    if (active.render) {
      active.render(bodyEl);
    } else {
      bodyEl.textContent = '차트/테이블 자리 (자리만 잡음)';
    }
  }

  document.getElementById('fn-section-list').addEventListener('click', (e) => {
    const chip = e.target.closest('.fn-section-chip');
    if (chip) {
      fnActiveId = chip.dataset.id;
      fnRenderSections();
    }
  });

  // ── 로그인 게이트 (dashboard.html과 동일 패턴) ──
  const gateEl = document.getElementById('db-gate');
  const gateErr = document.getElementById('db-gate-err');
  const loginBtn = document.getElementById('db-login-btn');

  function showGate(msg) {
    gateEl.hidden = false;
    loginBtn.disabled = false;
    gateErr.textContent = msg || '';
  }

  async function startProjectsPage() {
    gateEl.hidden = true;
    // 로그인 실패(RLS 차단) 여부는 데이터 항목을 열 때 fnFetchAuthedJson이 던지는 에러로 확인됨.
    fnRenderSections();
  }

  loginBtn.addEventListener('click', async () => {
    gateErr.textContent = '';
    loginBtn.disabled = true;
    const { error } = await sbAuth.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname },
    });
    if (error) {
      loginBtn.disabled = false;
      gateErr.textContent = '로그인 실패: ' + error.message;
    }
  });

  document.getElementById('db-signout').addEventListener('click', async () => {
    await sbAuth.auth.signOut();
    showGate();
  });

  // ── 다크모드 수동 토글 — OS 설정과 무관, localStorage에 저장 ──
  const themeToggleBtn = document.getElementById('db-theme-toggle');
  function fnApplyTheme(theme) {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeToggleBtn.textContent = '☀️ 라이트모드';
    } else {
      document.documentElement.removeAttribute('data-theme');
      themeToggleBtn.textContent = '🌙 다크모드';
    }
    fnApplyChartThemeDefaults();
    if (!gateEl.hidden) return; // 로그인 전이면 아직 섹션 없음
    // 재조회 없이 차트만 다시 그림(색만 바뀌는데 매번 Supabase 재요청하면 낭비)
    if (fnActiveId === 'mission-attend' && fnAttendRows) {
      fnRenderAttendChart(fnAttendRows);
      return;
    }
    if (fnActiveId === 'mission-funnel' && fnCachedHistory) {
      fnRenderFunnelChart(fnCachedHistory);
      return;
    }
    if (fnActiveId === 'trial-experiment' && fnTrialData) {
      fnRenderTrialCharts(document.getElementById('fn-content-body'), fnTrialData);
      return;
    }
    fnRenderSections();
  }
  themeToggleBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('chorditor-theme', next); } catch (e) {}
    fnApplyTheme(next);
  });
  let fnInitialTheme = 'light';
  try { fnInitialTheme = localStorage.getItem('chorditor-theme') || 'light'; } catch (e) {}
  fnApplyTheme(fnInitialTheme);

  sbAuth.auth.getSession().then(({ data: { session } }) => {
    if (session) startProjectsPage(); else showGate();
  });
</script>

<div class="grid-overlay" id="grid-overlay"></div>

<script>
  // G키로 그리드 오버레이 토글 — --grid-cols 값 읽어서 그만큼 컬럼 div 생성
  const overlay = document.getElementById('grid-overlay');

  function rebuildOverlay() {
    const cols = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-cols'), 10) || 6;
    overlay.innerHTML = '';
    for (let i = 0; i < cols; i++) {
      overlay.appendChild(document.createElement('div'));
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'g' && e.key !== 'G') return;
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    rebuildOverlay();
    overlay.classList.toggle('active');
  });

  window.addEventListener('resize', () => {
    if (overlay.classList.contains('active')) rebuildOverlay();
  });
</script>

</body>
